services:
  db:
    image: postgres:16-alpine
    container_name: quarto-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quarto
      POSTGRES_PASSWORD: quarto
      POSTGRES_DB: quarto
    volumes:
      - quarto_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarto -d quarto"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  quarto_pg_data:
